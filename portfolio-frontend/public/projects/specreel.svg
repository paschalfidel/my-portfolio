<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SpecReel movie discovery interface</title>
  <desc id="desc">A dark movie discovery interface with search, watchlist, ratings, and film cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111216"/><stop offset="1" stop-color="#261317"/></linearGradient>
    <linearGradient id="poster1" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d73b42"/><stop offset="1" stop-color="#381217"/></linearGradient>
    <linearGradient id="poster2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ba9bd"/><stop offset="1" stop-color="#263246"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="74" fill="#0c0d10"/>
  <rect x="42" y="22" width="32" height="32" rx="7" fill="#eb1c2b"/><text x="58" y="44" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="white">S</text>
  <text x="88" y="45" font-family="Arial" font-weight="700" font-size="23" fill="white">SPECREEL</text>
  <text x="265" y="44" font-family="Arial" font-size="16" fill="#d5d5d7">Discover</text>
  <rect x="420" y="20" width="360" height="36" rx="18" fill="#1c1d22" stroke="#33353d"/><text x="445" y="44" font-family="Arial" font-size="14" fill="#888b94">Search movies, cast, or genres</text>
  <text x="1050" y="44" font-family="Arial" font-size="15" fill="#d5d5d7">My watchlist</text>
  <text x="48" y="133" font-family="Arial" font-size="18" font-weight="700" fill="#eb1c2b">PERSONAL MOVIE DISCOVERY</text>
  <text x="48" y="183" font-family="Georgia" font-size="46" font-weight="700" fill="white">Find the next story</text>
  <text x="48" y="229" font-family="Georgia" font-size="46" font-weight="700" fill="white">worth watching.</text>
  <text x="50" y="274" font-family="Arial" font-size="18" fill="#b6b6bb">Search, save, review, and return to the films you love.</text>
  <rect x="48" y="310" width="146" height="44" rx="8" fill="#eb1c2b"/><text x="121" y="338" text-anchor="middle" font-family="Arial" font-weight="700" font-size="15" fill="white">Browse movies</text>
  <g transform="translate(610 116)">
    <rect x="0" y="0" width="170" height="238" rx="12" fill="url(#poster1)"/><circle cx="85" cy="88" r="45" fill="#f59a83" opacity=".5"/><text x="85" y="190" text-anchor="middle" font-family="Georgia" font-size="22" fill="white">AFTERLIGHT</text>
    <rect x="194" y="25" width="170" height="238" rx="12" fill="url(#poster2)"/><path d="M220 190L278 70l58 120z" fill="#d9e1ec" opacity=".55"/><text x="279" y="220" text-anchor="middle" font-family="Georgia" font-size="20" fill="white">NORTH</text>
    <rect x="388" y="0" width="170" height="238" rx="12" fill="#29202e"/><circle cx="473" cy="96" r="55" fill="#8d5b9d" opacity=".55"/><text x="473" y="190" text-anchor="middle" font-family="Georgia" font-size="19" fill="white">ECHO ROOM</text>
  </g>
  <line x1="48" x2="1152" y1="406" y2="406" stroke="#313239"/>
  <text x="48" y="453" font-family="Georgia" font-size="27" font-weight="700" fill="white">Popular now</text>
  <g transform="translate(48 482)" font-family="Arial">
    <rect width="254" height="132" rx="10" fill="#191a1f" stroke="#303139"/><text x="18" y="34" font-size="14" fill="#eb1c2b">DRAMA</text><text x="18" y="65" font-size="20" font-weight="700" fill="white">The Long Return</text><text x="18" y="96" font-size="14" fill="#a5a6ad">★ 8.4  ·  Save to watchlist</text>
    <rect x="276" width="254" height="132" rx="10" fill="#191a1f" stroke="#303139"/><text x="294" y="34" font-size="14" fill="#eb1c2b">THRILLER</text><text x="294" y="65" font-size="20" font-weight="700" fill="white">Signal Lost</text><text x="294" y="96" font-size="14" fill="#a5a6ad">★ 8.1  ·  Read reviews</text>
    <rect x="552" width="254" height="132" rx="10" fill="#191a1f" stroke="#303139"/><text x="570" y="34" font-size="14" fill="#eb1c2b">SCI-FI</text><text x="570" y="65" font-size="20" font-weight="700" fill="white">Other Worlds</text><text x="570" y="96" font-size="14" fill="#a5a6ad">★ 7.9  ·  Add a review</text>
    <rect x="828" width="276" height="132" rx="10" fill="#191a1f" stroke="#303139"/><text x="846" y="34" font-size="14" fill="#eb1c2b">YOUR ACCOUNT</text><text x="846" y="65" font-size="20" font-weight="700" fill="white">Pick up where you left off</text><text x="846" y="96" font-size="14" fill="#a5a6ad">Watchlists and reviews, saved.</text>
  </g>
</svg>
